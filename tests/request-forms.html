const tick=()=>new Promise(r=>{requestAnimationFrame(()=>requestAnimationFrame(r));setTimeout(r,60)});
async function until(test){for(let i=0;i<100;i++){if(test())return;await new Promise(r=>setTimeout(r,20))}throw Error('Timed out waiting for visible sticky header')}
async function settleHeader(w,d){
 // Scroll queues a header animation frame. Do not snapshot scrollY before its
 // CTA visibility and ResizeObserver height have caught up with the page.
 await until(()=>{
  const header=d.querySelector('.sticky').getBoundingClientRect();
  return Math.abs(parseFloat(w.getComputedStyle(d.documentElement).getPropertyValue('--sticky-height'))-header.height)<=1 &&
   d.querySelector('[data-source-cta="sticky-price"]').hidden===(d.querySelector('[data-source-cta="hero-price"]').getBoundingClientRect().bottom>header.bottom);
 });
}
function report(){output.textContent=JSON.stringify({cases:records.length,failed:records.filter(r=>!r.pass),records},null,2)}
function record(name,pass,extra={}){records.push({name,pass,...extra})}
async function load(width,mode='normal'){
 frame.style.width=width+'px';frame.style.height=(mode.startsWith('short')?400:mode.startsWith('medium')?600:800)+'px';
 if(mode==='nojs')frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');
 await new Promise(resolve=>{frame.onload=resolve;frame.src='../index.html'+(mode==='review'?'?review=1':'');});
 const w=frame.contentWindow,d=w.document; w.__testErrors=[];w.__testSinks=[];
 w.addEventListener('error',e=>w.__testErrors.push(e.message));w.addEventListener('unhandledrejection',e=>w.__testErrors.push(String(e.reason)));
 // During user actions reject/count network and storage sinks; never retain test values.
 for(const key of ['fetch','XMLHttpRequest','WebSocket']) w[key]=function(){w.__testSinks.push(key);throw Error('Unexpected transport: '+key)};
 w.navigator.sendBeacon=()=>{w.__testSinks.push('beacon');return false};
 w.Storage.prototype.setItem=function(){w.__testSinks.push('storage');throw Error('Unexpected storage')};
 if(mode.includes('zoom')) d.documentElement.style.fontSize=mode.includes('150')?'150%':'200%';
 d.documentElement.style.scrollBehavior='auto';await d.fonts.ready;await tick();return{w,d};
}
function geometry(w,d){const dialog=d.querySelector('dialog'),r=dialog.getBoundingClientRect(),c=d.querySelector('.request-close').getBoundingClientRect();return d.documentElement.scrollWidth<=d.documentElement.clientWidth+1 && dialog.scrollWidth<=dialog.clientWidth+1 && r.left>=0&&r.right<=w.innerWidth+1&&r.top>=0&&r.bottom<=w.innerHeight+1&&c.top>=r.top&&c.bottom<=r.bottom&&Array.from(dialog.querySelectorAll('input,select,textarea,button,h2,fieldset,label')).every(e=>{const b=e.getBoundingClientRect();return b.width===0||(b.left>=r.left&&b.right<=r.right+1)});}
function checkQuoteDetails(w,d,prefix){
 const fields=d.getElementById('request-fields'), details=fields.querySelector('details'), summary=details?.querySelector('summary');
 const controls=[...fields.querySelectorAll('[name]')];
 const visible=()=>controls.filter(e=>e.checkVisibility()).map(e=>e.name).join(',');
 record(prefix+'/short-form',!!summary && !details.open && summary.textContent==='Добавить детали' && visible()==='contact,city');
 summary.click();
 record(prefix+'/expanded',details.open && visible()===expected.price_quote.join(',') && geometry(w,d));
 summary.click();
 record(prefix+'/collapsed',!details.open && visible()==='contact,city' && geometry(w,d));
 const gap=d.querySelector('.request-legal').getBoundingClientRect().top-details.getBoundingClientRect().bottom;
 record(prefix+'/compact-consent-spacing',Math.abs(gap-parseFloat(w.getComputedStyle(d.querySelector('.request-legal')).marginTop))<=1,{gap});
 const payment=fields.querySelector('.request-payment');
 if(payment) record(prefix+'/payment-first',payment===fields.firstElementChild && payment.checkVisibility());
}
function checkDistribution(w,d,prefix){
 const specs=d.querySelector('#specs .specs-price-cta');
 record(prefix+'/specs-price/position',specs.previousElementSibling.matches('.spec-groups') && specs.nextElementSibling.matches('[data-sf676-gallery]') && d.querySelector('.spec-operations').closest('details')===d.querySelectorAll('.spec-group')[1] && !specs.closest('table,[data-sf676-gallery]'));
 const groups=[...d.querySelectorAll('#design .construction-grid')], cta=d.querySelector('#design .construction-cta');
 const cards=groups.flatMap(group=>[...group.querySelectorAll(':scope > article')]);
 const titles=cards.map(card=>card.querySelector('.feature-title span').textContent);
 record(prefix+'/design-consult/order',groups.length===2 && groups.every(g=>g.children.length===3) && cta.previousElementSibling===groups[0] && cta.nextElementSibling===groups[1] && titles.join('|')==='Поворотная вертикальная головка ±90°|Горизонтальный и вертикальный шпиндели|Литая станина|Скорости вращения и рабочие подачи|УЦИ|СОЖ, смазка и освещение');
 for(const [i,group] of groups.entries()){
   const boxes=[...group.children].map(e=>e.getBoundingClientRect()), r=group.getBoundingClientRect(), [a,b,c]=boxes;
   const width=w.innerWidth;
   record(prefix+'/design-grid-'+i,group.scrollWidth<=group.clientWidth+1 && boxes.every(box=>box.left>=r.left-1&&box.right<=r.right+1) &&
     (width>1100 ? Math.abs(a.top-b.top)<1&&Math.abs(b.top-c.top)<1&&b.left>=a.right&&c.left>=b.right :
      width>700 ? Math.abs(a.top-b.top)<1&&b.left>=a.right&&c.top>=Math.max(a.bottom,b.bottom)&&Math.abs(c.width-r.width)<1 :
      b.top>=a.bottom&&c.top>=b.bottom&&boxes.every(box=>Math.abs(box.width-r.width)<1)));
 }
 const actions=d.querySelector('.comparison-actions'),links=[...actions.children], [a,b]=links.map(e=>e.getBoundingClientRect()), r=actions.getBoundingClientRect();
 record(prefix+'/compare-new-price/group',links.length===2 && links[0].dataset.sourceCta==='compare-request' && links[1].dataset.sourceCta==='compare-new-price' && actions.scrollWidth<=actions.clientWidth+1 &&
   (w.innerWidth<=568 ? b.top-a.bottom>=15 && Math.abs(a.width-r.width)<1 && Math.abs(b.width-r.width)<1 : b.left-a.right>=15 || b.top-a.bottom>=15));
 const plant=d.querySelector('[data-source-cta="plant-region"]');
 record(prefix+'/plant-region/position',d.querySelectorAll('[data-source-cta="plant-region"]').length===1 && plant.parentElement.previousElementSibling.matches('.delivery-map-ui') && plant.parentElement.nextElementSibling.matches('.delivery-status') && !plant.closest('.delivery-map-ui,.delivery-canvas,.delivery-toolbar,.delivery-directory'));
}
async function matrix(){records=[];output.textContent='Проверка…';
 try{
 for(const mode of ['normal','zoom150','zoom'])for(const width of widths){output.textContent='Проверка: '+width+' / '+mode;const {w,d}=await load(width,mode);record(`${width}/${mode}/initialized`,!!w.SF676Requests);
 const total=d.getElementById('payment-total');
 total.value='1000000';
 total.dispatchEvent(new w.Event('input',{bubbles:true}));
 record(`${width}/${mode}/calculation-ready`,w.SF676Payments.getCalculation()?.totalKopeks===100000000);
 const triggers=[...d.querySelectorAll('[data-request-form]')];
 record(`${width}/${mode}/nineteen-triggers`,triggers.length===19 && new Set(triggers.map(link=>link.dataset.sourceCta)).size===19 && triggers.every(link=>link.dataset.sourceSection===(link.closest('section[id]')?.id||'sticky')));
 record(`${width}/${mode}/cta-placement`,
   d.querySelector('#advantages .adv-note').nextElementSibling.matches('.section-cta') &&
   d.querySelectorAll('#advantages .adv-card').length===5 &&
   !d.querySelector('[data-source-cta="gallery-price"]').closest('[data-sf676-gallery]') &&
   d.querySelector('#work-gallery > .wrap:last-child').previousElementSibling.matches('[data-sf676-gallery]') &&
   d.querySelector('#faq .faq-list').nextElementSibling.matches('.section-cta') &&
   !d.querySelector('[data-source-cta="faq-consult"]').closest('details'));
 checkDistribution(w,d,`${width}/${mode}`);
 for(const {section,cta,label,form,container,grouped,centered} of sectionButtons){
   const matches=triggers.filter(link=>link.dataset.sourceCta===cta);
   const link=matches[0], wrap=d.getElementById(section).querySelector(':scope > .wrap:last-child');
   record(`${width}/${mode}/${cta}/contract`,matches.length===1 && link.parentElement===(container?d.querySelector('#'+section+' '+container):wrap.lastElementChild) &&
     link.textContent===label && link.dataset.sourceSection===section && link.dataset.requestForm===form && !link.hasAttribute('data-payment-calculator'));
   if(link){
     const box=link.getBoundingClientRect(), column=link.parentElement.getBoundingClientRect();
     record(`${width}/${mode}/${cta}/layout`,box.height>=48 && (centered?Math.abs(box.left+box.width/2-column.left-column.width/2)<=1:grouped||Math.abs(box.left-column.left)<=1) && box.left>=column.left-1 &&
       box.right<=column.right+1 && (width>568 || Math.abs(box.width-column.width)<=1));
     if(centered)record(`${width}/${mode}/${cta}/red-style`,link.classList.contains('red')&&!link.classList.contains('out')&&
       w.getComputedStyle(link).backgroundColor===w.getComputedStyle(d.querySelector('[data-source-cta="hero-price"]')).backgroundColor);
   }
 }
 for(const link of triggers){
 const id=link.dataset.requestForm;
 if(link.closest('.sticky')){
   d.querySelector('#price').scrollIntoView();
   await until(()=>link.getClientRects().length>0);
 }else link.scrollIntoView();
 link.focus({preventScroll:true});await tick();await settleHeader(w,d);const y=w.scrollY;link.click();await tick();
 const dialog=d.querySelector('dialog'), names=[...new Set(Array.from(d.querySelectorAll('#request-fields [name]')).map(e=>e.name))];
 record(`${width}/${mode}/${link.dataset.sourceCta}/open`,dialog.open&&JSON.stringify(names)===JSON.stringify(expected[id])&&geometry(w,d)&&w.getComputedStyle(d.body).position==='fixed'&&d.activeElement.id==='request-title');
 if(id==='price_quote') checkQuoteDetails(w,d,`${width}/${mode}/${link.dataset.sourceCta}`);
 else record(`${width}/${mode}/${id}/flat-fields`,!d.querySelector('#request-fields details'));
 const sectionButton=sectionButtons.find(button=>button.cta===link.dataset.sourceCta);
 {
   const [title,description]=scenarioCopy[id];
   record(`${width}/${mode}/${link.dataset.sourceCta}/scenario-copy`,
     d.getElementById('request-title').textContent===title &&
     d.getElementById('request-description').textContent===description);
 }
 checkPrimaryAction(w,d,id,`${width}/${mode}/${link.dataset.sourceCta}`);
 d.querySelector('#request-submit').click();record(`${width}/${mode}/${id}/required`,d.querySelector('#request-contact').getAttribute('aria-invalid')==='true' && d.activeElement.id==='request-contact' && d.getElementById('request-contact-error').textContent==='Укажите телефон или e-mail');
 const contact=d.querySelector('#request-contact');contact.value='invalid-contact';d.querySelector('#request-submit').click();
 record(`${width}/${mode}/${link.dataset.sourceCta}/invalid-contact`,contact.getAttribute('aria-invalid')==='true' && w.SF676Requests.getDraft()===null);
 contact.value='qa+sf676@example.com';d.querySelector('#request-submit').click();
 const draft=w.SF676Requests.getDraft();record(`${width}/${mode}/${link.dataset.sourceCta}/valid-context`,!!draft&&draft.formId===id&&draft.sourceCta===link.dataset.sourceCta&&draft.sourceSection===link.dataset.sourceSection&&draft.contact.value==='qa+sf676@example.com'&&dialog.open&&contact.value==='qa+sf676@example.com'&&!contact.hasAttribute('aria-invalid')&&d.querySelector('#request-status').textContent==='Поля заполнены. Отправка пока не подключена');
 if(link.hasAttribute('data-payment-calculator')){
   record(`${width}/${mode}/calculator-quote`,draft?.context.calculation?.totalKopeks===100000000 && !!dialog.querySelector('.request-payment'));
 }
 if(sectionButton?.form==='price_quote'){
   record(`${width}/${mode}/${sectionButton.cta}/plain-quote`,!!draft &&
     !('calculation' in draft.context) && !dialog.querySelector('.request-payment'));
 }
 d.querySelector('.request-content').scrollTop=1e6;record(`${width}/${mode}/${id}/scroll`,geometry(w,d));
 d.querySelector('.request-close').click();await tick();await settleHeader(w,d);
 record(`${width}/${mode}/${link.dataset.sourceCta}/close`,!dialog.open&&d.activeElement===link&&Math.abs(w.scrollY-y)<=2&&w.SF676Requests.getDraft()===null&&d.querySelectorAll('#request-fields input').length===0&&w.getComputedStyle(d.body).position!=='fixed',{yBefore:y,yAfter:w.scrollY,focus:d.activeElement.dataset.sourceCta||d.activeElement.id});
 link.click();record(`${width}/${mode}/${id}/clean-reopen`,d.querySelector('#request-contact').value==='');w.SF676Requests.close();await tick();
 }
 record(`${width}/${mode}/no-side-effects`,!w.__testErrors.length&&!w.__testSinks.length,{errors:w.__testErrors,sinks:w.__testSinks});
 }
 const {w,d}=await load(390,'review');record('review-questions',d.body.classList.contains('showq')&&d.querySelector('#ql-rop a')?.hash==='#q-rop');
 const n=await load(390,'nojs');record('nojs-fallback',!n.w.SF676Requests&&n.d.querySelectorAll('section[id]:not(#qlist)').length===14&&Array.from(n.d.querySelectorAll('[data-request-form]')).every(a=>a.getAttribute('href')==='#order')&&n.d.querySelectorAll('#faq details').length===9&&!n.d.querySelector('dialog').open);
 for(const link of n.d.querySelectorAll('[data-request-form]')){
   const cta=link.dataset.sourceCta;
   if(link.hidden){record('nojs/'+cta,link.getAttribute('href')==='#order');continue;}
   link.scrollIntoView();link.click();await tick();
   const target=n.d.getElementById('order').getBoundingClientRect();
   record('nojs/'+cta,n.w.location.hash==='#order' && target.top<n.w.innerHeight && target.bottom>0 && !n.d.querySelector('dialog').open);
 }
 }catch(e){record('exception',false,{message:String(e)})}report();}
function checkSalesDrafts(w,d){
 const api=w.SF676Requests, form=d.getElementById('request-form');
 const field=name=>form.elements.namedItem(name);
 const set=(key,value)=>{field(key).value=value};
 const email='qa@example.com', identity='Станок Т-1, завод «Пример»\n№ Т-0001, 1986 г.';
 const problem='Шпиндель шумит при работе.', address='Тестовый посёлок, ул. 1-я, д. 2Б, корпус 3';
 for(const id of ['price_quote','configuration_help']){
  d.querySelector('[data-request-form="'+id+'"]').click();
  set('contact',email);
  record(id+'/company-label',field('company').labels[0].textContent.includes('ИНН или название предприятия'));
  for(const company of ['','0000000000','ООО «Тестовое предприятие»']){
   set('company',company);
   record(id+'/company-free-text',api.validate()&&api.getDraft().contact.company===company);
  }
  if(id==='price_quote'){
   const details=d.querySelector('#request-fields details'),summary=details.querySelector('summary');
   set('company','');
   const empty=api.getDraft();
   record('quote/empty-optional-keys',JSON.stringify(empty.contact)===JSON.stringify({value:email,name:'',company:''}) &&
     JSON.stringify(empty.context)===JSON.stringify({city:'',deliveryAddress:'',comment:''}));
   summary.click();set('name','Тест');set('company','ООО «Тест»');
   set('city','Тестовый город'); set('deliveryAddress',address); set('comment','Позвонить заранее');
   summary.click();
   const saved=api.getDraft();
   record('quote/collapsed-values',!details.open && saved.contact.name==='Тест' && saved.contact.company==='ООО «Тест»');
   const ctx=saved.context;
   record('quote/logistics',ctx.city==='Тестовый город'&&ctx.deliveryAddress===address&&ctx.comment==='Позвонить заранее');
   set('deliveryAddress','а'.repeat(301));
   record('quote/address-limit',!api.validate()&&api.getDraft()===null && details.open &&
     d.activeElement===field('deliveryAddress') && field('deliveryAddress').getAttribute('aria-invalid')==='true');
   set('deliveryAddress',address);
   record('quote/correct-address',api.validate()&&api.getDraft().context.deliveryAddress===address);
   api.close();d.querySelector('[data-source-cta="hero-price"]').click();
   record('quote/reopen-empty',!d.querySelector('#request-fields details').open &&
     expected.price_quote.every(k=>field(k).value===''));
  }else{
   set('task','Фрезерование корпуса');
   const ctx=api.getDraft().context;
   record('consultation/task-only',ctx.task==='Фрезерование корпуса'&&!('comment' in ctx));
  }
  api.close();
 }
 const trigger=d.querySelector('[data-source-cta="compare-request"]');
 trigger.click();set('contact',email);
 record('repair/contact-only',api.validate()&&api.getDraft().context.machineIdentity===''&&api.getDraft().context.problem==='');

 set('machineIdentity',identity);set('problem',problem);set('name','Тест');
 const draft=api.getDraft();
 record('repair/identity-and-condition',Object.keys(draft.context).sort().join(',')==='machineIdentity,problem'&&draft.context.machineIdentity===identity&&draft.context.problem===problem&&draft.contact.name==='Тест');
 for(const [key,valid] of [['machineIdentity',identity],['problem',problem]]){

 record('repair/clean-reopen',expected.repair_comparison.every(key=>field(key).value==='')&&api.getDraft()===null);
 api.close();
}
function checkPrimaryAction(w,d,id,prefix){
 const form=d.getElementById('request-form'),send=d.getElementById('request-submit');
 const style=w.getComputedStyle(send),box=send.getBoundingClientRect();
 record(prefix+'/single-primary-action',form.querySelectorAll('button').length===1 && !d.getElementById('request-check') &&
  !form.textContent.includes('Проверить заполнение') && !send.disabled && send.type==='submit' && send.form===form &&
  send.textContent===scenarioActions[id] && form.method==='dialog' && form.noValidate && !form.hasAttribute('action'));

   saved===JSON.stringify(api.getDraft()) && status.textContent==='Поля заполнены. Отправка пока не подключена' &&

   !d.getElementById('request-contact').value && api.getDraft()===null);

 }
