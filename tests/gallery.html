<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Проверка галерей СФ676</title>
<style>
  body { font: 16px system-ui; margin: 12px; }
  pre { white-space: pre-wrap; }
  #stage { max-width: 100%; overflow: auto; }
  iframe { display: block; height: 740px; border: 0; }
</style>
<h1>Проверка галерей СФ676</h1>
<button id="run">Проверить обе галереи</button>
<button id="manual">Открыть для проверки клавиатуры</button>
<pre id="results" role="status">Готово к проверке.</pre>
<div id="stage"></div>
<script type="module">
const stage = document.getElementById('stage');
const results = document.getElementById('results');
const run = document.getElementById('run');
const manual = document.getElementById('manual');
const groups = {
  specs: [4204, 4209, 4212, 4257, 4335],
  'work-gallery': [4135, 4168, 4274, 4276, 4325],
};

function check(condition, message) {
  if (!condition) throw new Error(message);
}

function painted(w) {
  return new Promise(resolve => w.requestAnimationFrame(() => w.requestAnimationFrame(resolve)));
}

async function loadPage(width, zoom = 100, js = true) {
  const frame = document.createElement('iframe');
  frame.title = 'Проверяемый лендинг';
  frame.width = width;
  if (!js) frame.setAttribute('sandbox', 'allow-same-origin');
  stage.replaceChildren(frame);
  await new Promise(resolve => {
    frame.onload = () => {
      if (frame.contentDocument.URL !== frame.src) return;
      frame.onload = null;
      resolve();
    };
    frame.src = '../index.html';
  });
  const d = frame.contentDocument;
  d.documentElement.style.fontSize = zoom + '%';
  d.documentElement.style.scrollBehavior = 'auto';
  await d.fonts.ready;
  await painted(frame.contentWindow);
  return frame;
}

async function checkLayout(width, zoom) {
  const frame = await loadPage(width, zoom);
  const d = frame.contentDocument;
  const w = frame.contentWindow;
  const errors = [];
  w.addEventListener('error', event => errors.push(event.message));
  w.addEventListener('unhandledrejection', event => errors.push(String(event.reason)));
  const sections = [...d.querySelectorAll('section[id]')].map(node => node.id);
  check(sections.join(' ') === 'top advantages specs config work-gallery plant price acceptance design compare delivery gov faq order qlist', 'Порядок секций');
  check(d.querySelectorAll('[data-sf676-gallery]').length === 2, 'Число галерей');
  const first = d.querySelector('#specs [data-sf676-gallery]');
  check(first.previousElementSibling.matches('.spec-operations') && first.nextElementSibling.id === 'technical-documents', 'Положение технических фотографий');
  check(d.documentElement.scrollWidth <= d.documentElement.clientWidth + 1, 'Горизонтальная прокрутка страницы');
  check(!w.performance.getEntriesByType('resource').some(r => /galleries\/.*-1600\.webp/.test(r.name) && !/(4204|4135)-1600\.webp$/.test(r.name)), 'Преждевременная загрузка большого фото');
  for (const [section, numbers] of Object.entries(groups)) {
    await checkGallery(frame, width, zoom, section, numbers);
  }
  const technical = first.querySelector('.tech-photo');
  first.querySelectorAll('.tech-thumb')[1].click();
  const workshop = d.querySelector('#work-gallery .mosaic-photo');
  let sharedDialog;
  for (const [link, counter] of [[technical, '2 из 5'], [workshop, '1 из 5']]) {
    link.click();
    const dialog = d.querySelector('.gallery-viewer:modal');
    check(!sharedDialog || dialog === sharedDialog, 'Единое окно просмотра');
    check(dialog.querySelector('img').src === link.href && dialog.querySelector('[role="status"]').textContent === counter, 'Смена группы');
    const closed = new Promise(resolve => dialog.addEventListener('close', resolve, {once: true}));
    dialog.querySelector('.gallery-close').click();
    await closed;
    sharedDialog = dialog;
  }
  check(technical.href.endsWith('4209-1600.webp') && workshop.getAttribute('aria-current') === 'true', 'Независимость выбора');
  for (const id of ['config', 'work-gallery', 'plant', 'price']) {
    const screen = d.getElementById(id);
    screen.scrollIntoView({block: 'start', behavior: 'instant'});
    await painted(w);
    const heading = screen.querySelector('h2').getBoundingClientRect();
    check(heading.top >= d.querySelector('.sticky').getBoundingClientRect().bottom && heading.top < w.innerHeight, 'Переход к #' + id);
  }

  for (const source of ['specs-fit', 'specs-price', 'gallery-price']) {
    const cta = d.querySelector('[data-source-cta="'+source+'"]');
    check(!cta.closest('[data-sf676-gallery]'), 'CTA вне контейнера галереи');
    cta.focus();
    cta.click();
    check(d.querySelector('#request-dialog:modal') && !d.querySelector('.gallery-viewer[open]'), 'Коммерческий CTA ' + source);
    d.querySelector('#work-gallery .mosaic-photo').click();
    check(d.querySelectorAll('dialog[open]').length === 1 && !d.querySelector('.gallery-viewer[open]'), 'Совместимость с формой');
    d.querySelector('.request-close').click();
    await painted(w);
    check(d.activeElement === cta, 'Фокус после формы');
  }
  check(!errors.length, 'Ошибка JavaScript: ' + errors.join(', '));
}

async function checkGallery(frame, width, zoom, section, expected) {
  const d = frame.contentDocument;
  const w = frame.contentWindow;
  const gallery = d.getElementById(section).querySelector('[data-sf676-gallery]');
  const showcase = section === 'specs';
  const track = gallery.querySelector(showcase ? '.tech-thumbs' : '.mosaic-grid');
  const links = [...gallery.querySelectorAll(showcase ? '.tech-thumbs a' : '.mosaic-photo, .mosaic-more a')];
  check(links.length === expected.length, 'Состав ' + section);
  gallery.scrollIntoView({block: 'center', behavior: 'instant'});
  await painted(w);
  const hero = gallery.querySelector('.tech-photo');
  if (showcase) {
    const rect = hero.getBoundingClientRect();
    const thumbs = track.getBoundingClientRect();
    check(Math.abs(rect.width * 2 / 3 - rect.height) <= 1, 'Пропорции большого кадра');
    check(width >= 1024 ? thumbs.left >= rect.right && Math.abs(thumbs.top - rect.top) < 2 :
      thumbs.top >= rect.bottom && w.getComputedStyle(track).scrollbarWidth === 'none', 'Композиция ракурсов');
    check(links.filter(link => link.getClientRects().length).length === (width >= 1024 ? 4 : 5), 'Количество видимых миниатюр');
    check(hero.href === links[0].href && gallery.querySelector('.tech-counter').textContent === '01 / 05', 'Начальный ракурс');
    gallery.querySelector('.gallery-prev').click();
    check(hero.href === links[4].href, 'Предыдущий ракурс');
    gallery.querySelector('.gallery-next').click();
    check(hero.href === links[0].href, 'Следующий ракурс');
    if (width === 390) {
      const gesture = (dx, dy) => {
        const touch = {pointerType: 'touch', pointerId: 1, isPrimary: true, bubbles: true};
        hero.dispatchEvent(new w.PointerEvent('pointerdown', {...touch, clientX: 100, clientY: 100}));
        hero.dispatchEvent(new w.PointerEvent('pointerup', {...touch, clientX: 100 + dx, clientY: 100 + dy}));
        hero.dispatchEvent(new w.MouseEvent('click', {detail: 1, bubbles: true, cancelable: true}));
      };
      gesture(-80, 5);
      check(hero.href === links[1].href && !d.querySelector('dialog[open]'), 'Свайп без двойного открытия');
      gesture(5, 90);
      check(hero.href === links[1].href && !d.querySelector('dialog[open]') &&
        w.getComputedStyle(hero).touchAction.includes('pan-y'), 'Вертикальная прокрутка');
      gesture(0, 0);
      const tapped = d.querySelector('.gallery-viewer:modal');
      check(tapped && tapped.querySelector('img').src === hero.href, 'Короткое касание');
      const closed = new Promise(resolve => tapped.addEventListener('close', resolve, {once: true}));
      tapped.querySelector('.gallery-close').click();
      await closed;
    }
  } else {
    const bounds = track.getBoundingClientRect();
    const header = gallery.querySelector('.gallery-header').getBoundingClientRect();
    check(header.bottom <= bounds.top + 1 && bounds.left >= 0 && bounds.right <= d.documentElement.clientWidth + 1, 'Заголовок и границы мозаики');
    const cards = links.slice(0, 3).map(link => link.getBoundingClientRect());
    const [large, top, bottom] = cards;
    check(links.filter(link => link.getClientRects().length).length === 3, 'Три видимых кадра');
    check(track.scrollWidth <= track.clientWidth + 1, 'Ширина мозаики');
    const all = gallery.querySelector('.mosaic-open');
    check(all.offsetHeight >= 44 && all.getBoundingClientRect().top >= bounds.bottom, 'Кнопка просмотра под фотографиями');
    if (width <= 640) {
      check(Math.abs(large.width - bounds.width) < 1 && top.top >= large.bottom &&
        Math.abs(top.top - bottom.top) < 1 && bottom.left >= top.right &&
        Math.abs(all.getBoundingClientRect().width - bounds.width) < 1, 'Мобильная мозаика');
    } else {
      check(top.left >= large.right && bottom.top >= top.bottom &&
        Math.abs(top.left - bottom.left) < 1 && Math.abs(large.bottom - bottom.bottom) < 1 &&
        large.width > top.width * 1.5, 'Асимметричная мозаика');
    }
    for (const link of links.slice(0, 3)) {
      const img = link.querySelector('img').getBoundingClientRect();
      const label = link.querySelector('.mosaic-name').getBoundingClientRect();
      const card = link.getBoundingClientRect();
      check(label.height > 0 && label.top >= card.top && label.bottom <= card.bottom + 1 &&
        link.scrollWidth <= link.clientWidth + 1, 'Подпись в пределах карточки');
      check(width <= 640 ? label.top >= img.bottom - 1 && Math.abs(img.width * 2 / 3 - img.height) <= 1 :
        label.bottom <= img.bottom + 1, 'Положение подписи');
    }

  }

  for (const [i, link] of links.entries()) {
    // Select every thumbnail from a different current view, including the initial one on desktop.
    if (showcase && hero.href === link.href) gallery.querySelector('.gallery-next').click();
    const thumb = link.querySelector('img');
    if (thumb) {
      link.scrollIntoView({block: 'center', inline: 'nearest', behavior: 'instant'});
      await thumb.decode();
      check(thumb.currentSrc.includes('proz' + expected[i] + '-') && thumb.alt, 'Превью ' + (i + 1));
      link.focus();
    }
    if (showcase) {
      link.click();
      check(!d.querySelector('dialog[open]') && hero.href === link.href &&
        gallery.querySelector('.tech-counter').textContent === '0' + (i + 1) + ' / 05' &&
        gallery.querySelector('.tech-name').textContent === link.querySelector('span').textContent &&
        link.getAttribute('aria-current') === 'true', 'Выбор ракурса ' + (i + 1));
      check(d.activeElement === (width >= 1024 ? hero : link), 'Фокус после выбора миниатюры');
      await hero.querySelector('img').decode();
      check(hero.querySelector('img').currentSrc.includes('proz' + expected[i] + '-'), 'Загрузка выбранного ракурса');
    }
    const trigger = showcase ? hero : thumb ? link : gallery.querySelector('.mosaic-open');
    trigger.focus();
    trigger.click();
    const dialog = d.querySelector('.gallery-viewer:modal');
    check(dialog && dialog.querySelector('.gallery-close') === d.activeElement, 'Начальный фокус');
    const image = dialog.querySelector('img');
    if (!thumb) {
      check(image.src === links[0].href && dialog.querySelector('[role="status"]').textContent === '1 из 5', 'Начало полного просмотра');
      for (let step = 0; step < i; step++) dialog.querySelector('.gallery-next').click();
    }
    await image.decode();
    check(image.src.endsWith(expected[i] + '-1600.webp') && image.naturalWidth === 1600 && image.naturalHeight === 1066, 'Открытие фото ' + (i + 1));
    check(dialog.querySelector('[role="status"]').textContent === (i + 1) + ' из 5', 'Номер фотографии');
    const caption = thumb?.alt || link.textContent.trim();
    check(image.alt === caption && dialog.querySelector('.gallery-caption').textContent === caption, 'Подпись');
    const inside = [...dialog.querySelectorAll('button, img, .gallery-caption')].every(node => {
      const r = node.getBoundingClientRect();
      return r.width > 0 && r.height > 0 && r.left >= -1 && r.top >= -1 && r.right <= width + 1 && r.bottom <= w.innerHeight + 1;
    });
    check(inside && w.getComputedStyle(image).objectFit === 'scale-down', 'Фото и управление в пределах окна');
    if (i === 0 || i === links.length - 1) {
      const edge = dialog.querySelector(i === 0 ? '.gallery-prev' : '.gallery-next');
      edge.click();
      check(edge.getAttribute('aria-disabled') === 'true' && image.src === link.href, 'Граница группы ' + section);
    }
    const direction = i < links.length - 1 ? '.gallery-next' : '.gallery-prev';
    dialog.querySelector(direction).click();
    const target = i + (i < links.length - 1 ? 1 : -1);
    check(image.src === links[target].href, 'Переключение в просмотре');
    if (width === 390 && zoom === 100 && i === 0) {
      const surface = dialog.querySelector('.gallery-stage');
      const gesture = (dx, dy) => {
        const touch = {pointerType: 'touch', pointerId: 1, isPrimary: true};
        surface.dispatchEvent(new w.PointerEvent('pointerdown', {...touch, clientX: 120, clientY: 100}));
        surface.dispatchEvent(new w.PointerEvent('pointerup', {...touch, clientX: 120 + dx, clientY: 100 + dy}));
      };
      gesture(10, 90);
      check(image.src === links[1].href, 'Вертикальный жест');
      gesture(-80, 5);
      check(image.src === links[2].href, 'Горизонтальный свайп');
    }
    const closed = new Promise(resolve => dialog.addEventListener('close', resolve, {once: true}));
    dialog.querySelector('.gallery-close').click();
    await closed;
    check(d.activeElement === trigger && !d.querySelector('dialog[open]'), 'Возврат фокуса');
  }
}

async function checkRequestLinks() {
  const frame = await loadPage(1366);
  const d = frame.contentDocument;
  const w = frame.contentWindow;
  const links = [...d.querySelectorAll('a[data-request-form]')];
  check(links.length === 19 && new Set(links.map(link => link.dataset.sourceCta)).size === 19, '19 уникальных ссылок на формы');
  const scenarios = new Set();
  for (const link of links) {
    const scrollTarget = link.closest('.sticky') ? d.getElementById('price') : link;
    scrollTarget.scrollIntoView({block: 'center', behavior: 'instant'});
    await painted(w);
    link.focus({preventScroll: true});
    link.click();
    const input = d.querySelector('#request-contact');
    const action = d.querySelector('#request-submit');
    check(input.value === '' && !action.disabled && action.type === 'submit' &&
      d.querySelectorAll('#request-form button').length === 1 && !d.querySelector('#request-check'), 'Чистая форма с одним локальным действием');
    action.click();
    check(d.querySelector('#request-dialog:modal') && input.getAttribute('aria-invalid') === 'true' && d.activeElement === input, 'Основная кнопка проверяет контакт');
    input.value = 'gallery-test@example.com';
    const draft = w.SF676Requests.getDraft();
    check(d.querySelector('#request-dialog:modal') && draft?.formId === link.dataset.requestForm &&
      draft.sourceSection === link.dataset.sourceSection && draft.sourceCta === link.dataset.sourceCta, 'CTA ' + link.dataset.sourceCta);
    scenarios.add(draft.formId);
    d.querySelector('.request-close').click();
    await painted(w);
    check(d.activeElement === link && !w.SF676Requests.getDraft(), 'Закрытие формы ' + link.dataset.sourceCta);
  }
  check(scenarios.size === 5, 'Пять сценариев');
  return links.length;
}

async function checkFallback(section, expected) {
  const frame = await loadPage(390, 100, false);
  const d = frame.contentDocument;
  const gallery = d.getElementById(section).querySelector('[data-sf676-gallery]');
  const links = [...gallery.querySelectorAll('a[href]')];
  check(links.length === 5 && !frame.contentWindow.SF676Requests &&
    [...gallery.querySelectorAll('button')].every(button => !button.getClientRects().length), 'Режим без JS');
  for (const [i, link] of links.entries()) {
    link.scrollIntoView({behavior: 'instant'});
    check(link.getClientRects().length > 0, 'Ссылка видна без JS');
    const img = link.querySelector('img');
    if (img) await img.decode();
    check(link.href.endsWith(expected[i] + '-1600.webp'), 'Обычная ссылка на WebP');
  }
  const navigated = new Promise(resolve => frame.addEventListener('load', resolve, {once: true}));
  const href = links[4].href;
  links[4].click();
  await navigated;
  check(frame.contentDocument.URL === href && frame.contentDocument.contentType === 'image/webp', 'Переход к WebP без JS');
}

run.onclick = async () => {
  run.disabled = manual.disabled = true;
  results.textContent = '';
  try {
    for (const width of [320, 375, 390, 640, 768, 1024, 1366, 1920]) {
      for (const zoom of [100, 200]) {
        results.textContent += width + ' px, текст ' + zoom + '% … ';
        await checkLayout(width, zoom);
        results.textContent += 'OK\n';
      }
    }
    const count = await checkRequestLinks();
    results.textContent += 'CTA и источники обращений — ' + count + ' из ' + count + '\n';
    for (const [section, numbers] of Object.entries(groups)) await checkFallback(section, numbers);
    results.textContent += 'Без JavaScript — OK';
  } catch (error) {
    results.textContent += 'Ошибка: ' + error.message;
  } finally {
    run.disabled = manual.disabled = false;
  }
};

manual.onclick = async () => {
  const frame = await loadPage(390);
  const photo = frame.contentDocument.querySelector('.tech-photo');
  photo.focus();
  photo.scrollIntoView({block: 'center', behavior: 'instant'});
};
</script>
</html>
