<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>СФ676 — проверка мастера</title>
<style>body{font:16px Arial;margin:16px}button,select{font:inherit;padding:8px;margin:6px}iframe{display:block;border:1px solid #aaa;height:800px;background:#fff}#stage{max-width:100%;overflow:auto}pre{white-space:pre-wrap;max-height:180px;overflow:auto}</style>
<h1>Проверка предварительного подбора СФ676</h1><label>Ширина <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1366</option></select></label><label>Режим <select id="mode"><option value="normal">Обычный</option><option value="zoom">Текст 200%</option><option value="review">Review</option><option value="nojs">Без JavaScript</option><option value="noforms">Без API форм</option></select></label><button id="show">Открыть</button><button id="run">Проверить мастер</button><button id="regressions">Проверить формы и fallback</button><pre id="results">Готово к проверке.</pre><div id="stage"><iframe id="page" title="Проверяемая страница"></iframe></div>
<script>
const frame=document.getElementById('page'),output=document.getElementById('results');let results=[];
const tick=()=>new Promise(r=>{requestAnimationFrame(()=>requestAnimationFrame(r));setTimeout(r,80)});
const record=(name,pass,details={})=>results.push({name,pass,...details});
function report(){output.textContent=JSON.stringify({count:results.length,failed:results.filter(r=>!r.pass),results},null,2)}
async function load(width=390,mode='normal'){
 frame.style.width=width+'px';if(mode==='nojs')frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');
 await new Promise(r=>{frame.onload=r;frame.src='../index.html'+(mode==='review'?'?review=1':'')});const w=frame.contentWindow,d=w.document;
 w.__errors=[];w.__sinks=[];w.addEventListener('error',e=>w.__errors.push(e.message));w.addEventListener('unhandledrejection',e=>w.__errors.push(String(e.reason)));
 for(const key of ['fetch','XMLHttpRequest','WebSocket'])w[key]=function(){w.__sinks.push(key);throw Error('Unexpected transport')};w.navigator.sendBeacon=()=>{w.__sinks.push('beacon');return false};w.Storage.prototype.setItem=function(){w.__sinks.push('storage');throw Error('Unexpected storage')};
 d.documentElement.style.scrollBehavior='auto';if(mode==='zoom')d.documentElement.style.fontSize='200%';if(mode==='noforms')w.SF676Requests=undefined;
 await tick();return{w,d};
}
function click(d,action){d.querySelector('[data-selector-action="'+action+'"]').click()}
function pick(w,d,id){const input=d.querySelector('#selector-'+id);if(!input)throw Error('Missing option '+id);input.checked=true;input.dispatchEvent(new w.Event('change',{bubbles:true}))}
function enter(w,d,text){const input=d.querySelector('#selector-stage textarea');input.value=text;input.dispatchEvent(new w.Event('input',{bubbles:true}))}
function shape(w,d,where){const box=d.querySelector(where),r=box.getBoundingClientRect();return d.documentElement.scrollWidth<=d.documentElement.clientWidth+1&&box.scrollWidth<=box.clientWidth+1&&Array.from(box.querySelectorAll('button,input,textarea,legend,dt,dd')).every(e=>{const b=e.getBoundingClientRect();return b.width===0||(b.left>=r.left-1&&b.right<=r.right+1)});}
async function next(w,d,name){click(d,'next');await tick();record(name+'/layout',shape(w,d,'#sf676-selector'));const h=d.querySelector('#selector-stage [tabindex="-1"]');const marker=d.querySelector('.selector-progress')||h;record(name+'/focus',d.activeElement===h&&marker.getBoundingClientRect().top>=d.querySelector('.sticky').getBoundingClientRect().bottom-2,{focused:d.activeElement===h,top:marker.getBoundingClientRect().top,headerBottom:d.querySelector('.sticky').getBoundingClientRect().bottom});}
async function exact(w,d,prefix){
 d.querySelector('[data-selector-mode="exact"]').click();click(d,'next');record(prefix+'/required',!!d.querySelector('#selector-error').textContent&&d.querySelector('legend').textContent.includes('размер'));
 for(const id of ['table-table_300x800','taper-taper_km4','dro-dro_optical','coordinates-coordinates_f3','screw-screw_ball']){pick(w,d,id);await next(w,d,prefix+'/'+id)}
 let r=w.SF676Selector.getResult();record(prefix+'/actual-result',r.selections.table==='table_300x800'&&r.selections.coordinates==='coordinates_f3'&&d.querySelector('.selector-summary').textContent.includes('300 × 800'));
 const resultCta=d.querySelector('[data-selector-action="request"]');resultCta.click();await tick();record(prefix+'/form-summary',d.querySelector('dialog').open&&d.querySelector('.request-selection').textContent.includes('300 × 800')&&shape(w,d,'dialog'));
 d.querySelector('#request-contact').value='qa@example.com';let draft=w.SF676Requests.getDraft();record(prefix+'/payload',JSON.stringify(draft.context.selector)===JSON.stringify(r)&&draft.sourceSection==='config'&&draft.sourceCta==='selector-exact-result');w.SF676Requests.close();await tick();record(prefix+'/return-focus',d.activeElement===resultCta);
 click(d,'edit');click(d,'next');click(d,'next');pick(w,d,'dro-dro_none');await next(w,d,prefix+'/no-dro');record(prefix+'/not-applicable',!d.querySelector('#selector-stage input')&&d.querySelector('.selector-unavailable').textContent.includes('Не применяется'));await next(w,d,prefix+'/skip-coordinates');await next(w,d,prefix+'/result-without-dro');r=w.SF676Selector.getResult();record(prefix+'/cleared-coordinates',r.selections.coordinates==='not_applicable');
 click(d,'edit');click(d,'next');click(d,'next');pick(w,d,'dro-dro_magnetic');click(d,'next');click(d,'next');record(prefix+'/reselection-required',!!d.querySelector('#selector-error').textContent&&w.SF676Selector.getResult()===null&&!d.querySelector('input:checked'));pick(w,d,'coordinates-consultation');click(d,'next');click(d,'next');
}
async function quiz(w,d,prefix){
 d.querySelector('[data-selector-mode="quiz"]').click();pick(w,d,'operations-milling');pick(w,d,'operations-slotting');pick(w,d,'operations-consultation');record(prefix+'/consultation-exclusive',d.querySelectorAll('#selector-stage input:checked').length===1);pick(w,d,'operations-milling');pick(w,d,'operations-slotting');await next(w,d,prefix+'/operations');
 enter(w,d,'Тестовая деталь 100 × 50 мм');pick(w,d,'dimensions-unknown');await next(w,d,prefix+'/parts');pick(w,d,'tooling-tooling_40');await next(w,d,prefix+'/tooling');pick(w,d,'positioning-consultation');await next(w,d,prefix+'/positioning');pick(w,d,'extras-accessories');pick(w,d,'extras-timing');enter(w,d,'Тестовые технические условия');await next(w,d,prefix+'/extras');
 const r=w.SF676Selector.getResult();record(prefix+'/requirements-only',!r.selections&&r.requiresConsultation&&r.requirements.operations.length===2&&r.requirements.parts.description==='Тестовая деталь 100 × 50 мм');
 d.querySelector('[data-selector-action="request"]').click();await tick();record(prefix+'/modal-visible',d.querySelector('.request-selection').textContent.includes('Тестовая деталь')&&!d.querySelector('#request-task')&&shape(w,d,'dialog'));d.querySelector('#request-contact').value='qa@example.com';record(prefix+'/payload',JSON.stringify(w.SF676Requests.getDraft().context.selector)===JSON.stringify(r));w.SF676Requests.close();
 click(d,'edit');click(d,'next');record(prefix+'/back-retains',d.querySelector('textarea').value==='Тестовая деталь 100 × 50 мм');enter(w,d,'Изменённое описание');click(d,'result');record(prefix+'/edited-summary',d.querySelector('.selector-summary').textContent.includes('Изменённое описание'));
 d.querySelector('[data-selector-mode="exact"]').click();record(prefix+'/mode-separation',w.SF676Selector.getResult().selections.coordinates==='consultation');d.querySelector('[data-selector-mode="quiz"]').click();record(prefix+'/quiz-retained',w.SF676Selector.getResult().requirements.parts.description==='Изменённое описание');click(d,'reset');record(prefix+'/reset',!d.querySelector('input:checked')&&w.SF676Selector.getResult()===null);
 pick(w,d,'operations-consultation');click(d,'next');click(d,'next');pick(w,d,'tooling-consultation');click(d,'next');pick(w,d,'positioning-consultation');click(d,'next');click(d,'next');record(prefix+'/optional-skipped',w.SF676Selector.getResult().requirements.parts.description===''&&d.querySelector('.selector-summary').textContent.includes('Не указано'));
}
async function run(){results=[];try{for(const mode of ['normal','zoom'])for(const width of [320,390,768,1366]){output.textContent='Проверка '+width+'/'+mode;const {w,d}=await load(width,mode);record('init/'+width+'/'+mode,!!w.SF676Selector&&!d.querySelector('#sf676-selector').hidden);await exact(w,d,width+'/'+mode+'/exact');await quiz(w,d,width+'/'+mode+'/quiz');record(width+'/'+mode+'/clean',!w.__errors.length&&!w.__sinks.length,{errors:w.__errors,sinks:w.__sinks});}}catch(e){record('exception',false,{message:String(e)})}report()}
async function regressions(){results=[];try{
 let {w,d}=await load(390);record('fresh-after-reload',w.SF676Selector.getResult()===null&&!d.querySelector('#selector-stage').children.length);const urls=[];
 for(const link of d.querySelectorAll('[data-request-form]')){link.click();record('existing-cta/'+link.dataset.sourceCta,d.querySelector('dialog').open);w.SF676Requests.close()}
 for(let i=0;i<20;i++){w.SF676Selector.start(i%2?'exact':'quiz');w.SF676Selector.reset()}record('repeated-mode-switches',d.querySelectorAll('#selector-stage fieldset').length===1);
 w.SF676Selector.start('exact');pick(w,d,'table-consultation');click(d,'next');pick(w,d,'taper-consultation');click(d,'next');pick(w,d,'dro-consultation');click(d,'next');pick(w,d,'coordinates-consultation');click(d,'next');pick(w,d,'screw-consultation');click(d,'next');record('all-unknown-valid',Object.values(w.SF676Selector.getResult().selections).every(v=>v==='consultation'));
 w.SF676Requests=undefined;d.querySelector('[data-selector-action="request"]').click();record('no-form-fallback',w.location.hash==='#order'&&!d.querySelector('dialog').open);
 ({w,d}=await load(390,'review'));record('review',d.querySelectorAll('#qol li').length===12);d.querySelector('#ql-stol a').click();
 const q=d.querySelector('#q-stol-2');const back=d.createElement('a');back.href='#q-stol-2';d.body.appendChild(back);back.click();await tick();record('review-hidden-reference',d.querySelector('#config-reference').open&&q.getBoundingClientRect().height>0);
 ({w,d}=await load(390,'nojs'));record('nojs-static-content',d.querySelector('#sf676-selector').hidden&&d.querySelectorAll('.config-option').length===5&&d.querySelectorAll('#config-reference summary').length===1&&!w.SF676Selector);
 d.querySelector('#config-reference').open=true;record('nojs-details-readable',d.querySelector('.config-options').getBoundingClientRect().height>0&&d.querySelector('a[href^="tel:"]')&&d.querySelector('a[href^="mailto:"]'));
 }catch(e){record('exception',false,{message:String(e)})}report()}
document.querySelector('#show').onclick=()=>load(+document.querySelector('#width').value,document.querySelector('#mode').value);document.querySelector('#run').onclick=run;document.querySelector('#regressions').onclick=regressions;
</script></html>
